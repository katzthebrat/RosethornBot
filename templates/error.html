<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - RosethornBot</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a0000, #2c0a0a);
            color: #e6d7d7;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .error-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 3rem;
            border-radius: 15px;
            border: 2px solid #711417;
            box-shadow: 0 8px 32px rgba(113, 20, 23, 0.3);
            max-width: 500px;
        }
        .error-title {
            color: #711417;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(113, 20, 23, 0.5);
        }
        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-code {
            color: #999;
            font-size: 0.9rem;
            margin-top: 2rem;
            opacity: 0.7;
        }
        .home-link {
            display: inline-block;
            background: linear-gradient(45deg, #711417, #8B1A1A);
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .home-link:hover {
            background: linear-gradient(45deg, #8B1A1A, #711417);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(113, 20, 23, 0.4);
        }
        .rose {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="rose">🥀</div>
        <h1 class="error-title">{{ error_code or "500" }}</h1>
        <p class="error-message">
            {{ error_message or "A thorny situation has occurred in the manor. Our Victorian servants are working to resolve this issue." }}
        </p>
        <a href="/" class="home-link">Return to Manor</a>
        {% if error_code %}
        <div class="error-code">Error Code: {{ error_code }}</div>
        {% endif %}
    </div>
</body>
</html>
